# Step 11 — Nyaya-3B-v1 training run on 1x A100 (configs/train_v1.yaml):
# 6,297 train / 331 val examples, LoRA bf16, ~197 steps, checkpoints + eval
# every 50 steps for per-checkpoint benchmarking. Runs from the PVC-staged
# repo tree; outputs/legal-3b-v1 (incl. all checkpoints) lands on the PVC.
#
#   kubectl apply -f k8s/train-v1-job.yaml
#   kubectl logs -f job/train-v1 -n askdata-ng
apiVersion: batch/v1
kind: Job
metadata:
  name: train-v1
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app: train-v1
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: train-v1
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command: ["python", "scripts/09_train.py"]
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
