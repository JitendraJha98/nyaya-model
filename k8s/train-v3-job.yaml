# Step 17 (v3) — Nyaya-3B-v3 RAFT training on 1x A100 (configs/train_v3.yaml),
# then RAG-eval of every checkpoint on the frozen eval in the same allocation.
# sentence-transformers is installed at job start for the hybrid retriever
# (doc-vector cache lives on the PVC; e5 weights cache under HF_HOME).
# Stage the repo AND data/splits_rag_v3 to the PVC first.
#
#   kubectl apply -f k8s/train-v3-job.yaml
#   kubectl logs -f job/train-v3 -n askdata-ng
apiVersion: batch/v1
kind: Job
metadata:
  name: train-v3
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: train-v3
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: train-v3
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command:
            - /bin/bash
            - -c
            - |
              set -e
              pip install --quiet sentence-transformers
              python scripts/09_train.py configs/train_v3.yaml
              for ckpt in outputs/legal-3b-v3/checkpoint-* outputs/legal-3b-v3/final; do
                [ -d "$ckpt" ] || continue
                python scripts/16_rag_eval.py --adapter "$ckpt" --dense
              done
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
