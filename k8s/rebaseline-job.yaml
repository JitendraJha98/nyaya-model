# Phase 0 re-baseline — one GPU allocation, two frozen-eval runs under the
# MERGED retriever (domain-hinted gold, procedures KB in context, new prompt
# wording, expanded synonyms, tags/punishment_summary indexed):
#   1. base model + dense RAG   (control)
#   2. v3 checkpoint-300 + dense RAG (current champion)
# Explicit -r2 labels so the pre-merge runs in reports/rag_eval.json are not
# overwritten. Doc vectors recompute on first --dense (KB grew the corpus).
#
#   kubectl apply -f k8s/rebaseline-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rebaseline
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: rebaseline
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: rebaseline
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command:
            - /bin/bash
            - -c
            - |
              set -e
              pip install --quiet sentence-transformers
              python scripts/16_rag_eval.py --adapter none --dense --label rebase-r2_base
              python scripts/16_rag_eval.py --adapter outputs/legal-3b-v3/checkpoint-300 \
                --dense --label rebase-r2_v3-ckpt300
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
