# Step 18 (v3) — one GPU allocation, three steps:
#   1. RAG+base with DENSE retrieval (the missing ablation — v3 rows used
#      dense, the old base row used BM25-only; identical retrieval needed)
#   2. DPO on the v3 winner (checkpoint-300) with the 124 citation pairs
#   3. RAG-eval of the DPO adapter under the same dense retrieval
#
#   kubectl apply -f k8s/dpo-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: dpo-train
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: dpo-train
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: dpo-train
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command:
            - /bin/bash
            - -c
            - |
              set -e
              pip install --quiet sentence-transformers
              python scripts/23_dpo_train.py --sft-adapter outputs/legal-3b-v3/checkpoint-300
              python scripts/16_rag_eval.py --model outputs/legal-3b-v3-dpo/final \
                --adapter none --dense --label rag_dense_k8_v3-dpo
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
