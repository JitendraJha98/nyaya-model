# Runs scripts/01_download_model.py once on a single GPU: loads
# Qwen2.5-3B-Instruct and generates one response, proving GPU inference
# works in-cluster. Not a serving Deployment — the pod exits after the run.
apiVersion: batch/v1
kind: Job
metadata:
  name: nyaya-gpu-smoke-test
  namespace: askdata-ng
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: nyaya-gpu-smoke-test
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia   # matches both GPU pools in this cluster; the tainted
                               # A100 "aidp" pool is skipped since we tolerate nothing
      containers:
        - name: nyaya-smoke-test
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"   # must equal the request — GPUs are not overcommittable
          volumeMounts:
            - name: hf-cache
              mountPath: /data/hf-cache
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: nyaya-hf-cache
