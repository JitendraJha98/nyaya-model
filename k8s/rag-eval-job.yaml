# Step 13 (v2) — RAG eval on 1x A100: retriever + v1 adapter (checkpoint-50)
# on the frozen 500-question eval, then the RAG + base-model ablation.
# Runs from the PVC-staged repo tree (stage the current commit first);
# reports + predictions land on the PVC under the repo tree.
#
#   kubectl apply -f k8s/rag-eval-job.yaml
#   kubectl logs -f job/rag-eval -n askdata-ng
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-eval
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: rag-eval
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: rag-eval
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command:
            - /bin/bash
            - -c
            - |
              set -e
              python scripts/16_rag_eval.py --adapter outputs/legal-3b-v1/checkpoint-50
              python scripts/16_rag_eval.py --adapter none
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
