# Step 14 (v2) — Nyaya-3B-v2 training on 1x A100 (configs/train_v2.yaml):
# same 6,297 examples as v1, rewrapped in the inference-time RAG prompt
# (data/splits_rag). After training, every checkpoint is RAG-evaluated on
# the frozen eval in the same job, so one GPU allocation covers both.
# Stage the repo AND data/splits_rag to the PVC first (splits_rag is
# gitignored — copy it separately from the git archive).
#
#   kubectl apply -f k8s/train-v2-job.yaml
#   kubectl logs -f job/train-v2 -n askdata-ng
apiVersion: batch/v1
kind: Job
metadata:
  name: train-v2
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app: train-v2
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: train-v2
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command:
            - /bin/bash
            - -c
            - |
              set -e
              python scripts/09_train.py configs/train_v2.yaml
              for ckpt in outputs/legal-3b-v2/checkpoint-* outputs/legal-3b-v2/final; do
                [ -d "$ckpt" ] || continue
                python scripts/16_rag_eval.py --adapter "$ckpt"
              done
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
