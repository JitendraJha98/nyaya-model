# Grounded synthetic-data generation as an in-cluster Job. The driver reaches
# the teacher via Service DNS (no port-forward — local tunnels cannot sustain
# hours of concurrent streaming). The repo tree (code + canonical statute DB)
# and the resumable raw output live on the hf-model-cache PVC under /gen/repo,
# staged there by a loader pod (kubectl cp of `git archive HEAD` + the raw
# JSONL). CPU-only: generation is I/O against the teacher.
#
#   kubectl apply -f k8s/datagen-job.yaml
#   kubectl logs -f job/datagen -n askdata-ng
apiVersion: batch/v1
kind: Job
metadata:
  name: datagen
  namespace: askdata-ng
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: datagen
    spec:
      restartPolicy: Never
      containers:
        - name: datagen
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          workingDir: /data/hf-cache/gen/repo
          command: ["python", "scripts/04_generate_examples.py"]
          args: ["--composition", "full", "--concurrency", "6"]
          env:
            - name: TEACHER_BASE_URL
              value: "http://inference-server:8000/v1"
            - name: PYTHONIOENCODING
              value: utf-8
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /data/hf-cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hf-model-cache
