# Runs scripts/02_run_baseline.py (base model on the frozen eval set) on 1 GPU.
# Harness code + eval data are injected via ConfigMaps and take precedence over
# whatever tree the image was built from (PYTHONPATH), so an image rebuild is
# never needed for harness iterations:
#
#   kubectl create configmap eval-src     -n askdata-ng --from-file=src/nyaya/
#   kubectl create configmap eval-scripts -n askdata-ng --from-file=02_run_baseline.py=scripts/02_run_baseline.py
#   kubectl create configmap eval-data    -n askdata-ng \
#       --from-file=nyaya_eval_v0.jsonl=data/eval/nyaya_eval_v0.jsonl
#   kubectl apply -f k8s/hf-cache-pvc.yaml -f k8s/baseline-job.yaml
#
# Results land on the hf-model-cache PVC under /data/hf-cache/runs/baseline/
# (reports/baseline.json + outputs/baseline/predictions.jsonl). Retrieve with a
# helper pod mounting the same PVC, then commit reports/baseline.json.
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-baseline
  namespace: askdata-ng
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: eval-baseline
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: eval-baseline
          image: acrcgipulsescusdev.azurecr.io/nyaya:smoke-v3
          imagePullPolicy: IfNotPresent
          command: ["python", "/work/scripts/02_run_baseline.py"]
          args:
            - "--eval-file"
            - "/work/data/eval/nyaya_eval_v0.jsonl"
            - "--out-dir"
            - "/data/hf-cache/runs/baseline"
            - "--batch-size"
            - "8"
          env:
            - name: PYTHONPATH
              value: /work/src
            - name: PYTHONIOENCODING
              value: utf-8
            - name: HF_HOME
              value: /data/hf-cache
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /data/hf-cache
            - name: src
              mountPath: /work/src/nyaya
            - name: scripts
              mountPath: /work/scripts
            - name: data
              mountPath: /work/data/eval
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-model-cache
        - name: src
          configMap:
            name: eval-src
        - name: scripts
          configMap:
            name: eval-scripts
        - name: data
          configMap:
            name: eval-data
