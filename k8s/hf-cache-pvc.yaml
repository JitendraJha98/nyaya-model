# Persists the Hugging Face cache (HF_HOME) across eval/smoke Job runs so the
# base model (~6GB) is downloaded once, not on every retry.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-model-cache
  namespace: askdata-ng
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # cluster default storageClassName is "default" (disk.csi.azure.com) — fine for RWO single-pod use
