[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya"
description = "Nyaya — an open Indian legal guidance system: statute DB, retriever, reranker, evaluation harness (Qwen3-4B-Instruct-2507 as the default reader)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jitendra Jha" }]
keywords = ["legal", "india", "llm", "qwen", "lora", "nyaya", "bns", "hinglish"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
# GPU training + evaluation (Kaggle T4 tested). Same floors as requirements-train.txt.
train = [
    "torch>=2.5",
    "transformers>=4.56,<5",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.12",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
# Optional dense retrieval stage (src/nyaya/dense.py) and the cross-encoder reranker.
dense = ["sentence-transformers>=3.0", "numpy"]
# Statute-DB build (PDF extraction) and bulk judgment sync.
data = ["pymupdf>=1.24", "boto3>=1.34"]
# Local demo (app.py).
demo = ["gradio>=4.0"]
dev = ["pytest>=8", "ruff>=0.5", "datasets>=2.20"]

[project.scripts]
nyaya = "nyaya.cli:main"

[project.urls]
Homepage = "https://github.com/JitendraJha98/nyaya-model"
Repository = "https://github.com/JitendraJha98/nyaya-model"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nyaya.__version__" }
dependencies = { file = ["requirements.txt"] }
