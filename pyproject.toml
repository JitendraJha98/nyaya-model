[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya"
description = "Nyaya — an open Indian legal guidance model (Qwen2.5-3B-Instruct + LoRA)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jitendra Jha" }]
keywords = ["legal", "india", "llm", "qwen", "lora", "nyaya", "bns", "hinglish"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/JitendraJha98/nyaya-model"
Repository = "https://github.com/JitendraJha98/nyaya-model"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nyaya.__version__" }
dependencies = { file = ["requirements.txt"] }
