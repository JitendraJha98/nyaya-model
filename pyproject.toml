[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya"
version = "0.1.0"
description = "Nyaya — an open Indian legal guidance model (Qwen2.5-3B-Instruct + QLoRA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jitendra Jha" }]
keywords = ["legal", "india", "llm", "qwen", "qlora", "nyaya", "bns", "hinglish"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/JitendraJha98/nyaya-model"
Repository = "https://github.com/JitendraJha98/nyaya-model"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
