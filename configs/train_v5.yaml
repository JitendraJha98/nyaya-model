# Nyaya-3B-v5 — grounded-citation training (Milestone 2).
#
# Trains the skill Eval-v1 showed is actually missing: with the gold statute
# already in context, base Qwen2.5-3B still missed 71 required facts, 41% of
# them by citing the wrong section and 21% by dropping the exact number. v3
# trained on section-named questions, which RAG already handles — hence its
# statistical tie with base. v5 trains selection-among-distractors + verbatim
# copying, under the serving distribution.
#
# Method: full-precision bf16 LoRA — NO quantization (project decision 2026-07-13).

run_name: legal-3b-v5
model_id: Qwen/Qwen2.5-3B-Instruct
output_dir: outputs/legal-3b-v5

data:
  train_file: data/splits_v5/train.jsonl
  val_file: data/splits_v5/val.jsonl
  # Sized to the hardware, measured not guessed: a T4 does ~152 s/step at
  # seq 4096 with batch 1 x accum 16, so the full 2,817 x 2 epochs projects to
  # 14.9h -- more than the entire remaining quota. 1,200 examples x 1 epoch is
  # 75 steps, ~3.2h. scripts/30 shuffles by section before writing, so the head
  # of the file is already a mix of subtypes rather than one act's worth.
  max_examples: 1200

method: lora

lora:
  # Same rank as v3/v4 so the comparison isolates the DATA change. If v5 beats
  # base where v3 did not, that is attributable to what it was trained on.
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  # Measured, not inherited: the longest v5 example is ~3,850 tokens (p100),
  # so 4096 covers every row. v3/v4 used 6144, which on a 16GB T4 would waste
  # activation memory on padding that no example needs.
  max_seq_length: 4096
  # 1 epoch, not 2: see the max_examples note above. Two epochs over the full
  # set is a 14.9h run on this hardware.
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  bf16: true
  optim: adamw_torch_fused
  neftune_noise_alpha: 5
  # T4s have 16GB, not the A100 80GB this pipeline was built on. Batch 1 with
  # accumulation 16 keeps the effective batch at 16 without OOM.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  logging_steps: 10
  # ~2.8K examples x 2 epochs / effective batch 16 = ~352 steps
  eval_steps: 50
  save_steps: 100
