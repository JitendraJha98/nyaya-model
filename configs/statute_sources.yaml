    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/2065/1/aa2005.pdf
    notes: Amended by the RTI (Amendment) Act, 2019.

  - id: domestic_violence
    name: Protection of Women from Domestic Violence Act, 2005
    act_no: 43 of 2005
