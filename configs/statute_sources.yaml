# Source URLs for the 13 priority acts (docs/ROADMAP.md "Core data assets" #1).
#
# Verified 2026-07-13 via India Code search (title/act-no/date cross-checked
# against search snippets, e.g. Code on Wages 2019 snippet shows "[As on the
# 21st November, 2025]", matching the labour-codes commencement date already
# noted in data/eval/ commit history). NOT fetched/opened directly — see
# "known issue" below.
#
# KNOWN ISSUE: indiacode.nic.in returns HTTP 403 to non-browser requests
# (confirmed via WebFetch tool). scripts/03_build_corpus.py must use a real
# browser User-Agent and session/cookie handling (e.g. requests.Session()
# with headers mimicking Chrome, possibly retries/backoff) — a naive
# `requests.get()` will also 403.
#
# `handle_url` is the India Code item page (stable, always shows current
# version + amendments). `pdf_url` is a direct PDF link seen at verification
# time — India Code periodically republishes PDFs at new bitstream IDs when
# an act is amended, so prefer scraping the current PDF link FROM the handle
# page rather than hardcoding pdf_url long-term. pdf_url here is a fallback /
# spot-check reference.

acts:
  - id: constitution
    name: Constitution of India
    act_no: null
    handle_url: https://www.indiacode.nic.in/handle/123456789/15240?locale=en
    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/19632/1/the_constitution_of_india.pdf
    notes: >
      Multiple PDF snapshots exist at different bitstream IDs (as amendments
      are made). Verify pdf_url points to the most recent snapshot before
      scraping — check the handle page for the latest link.

  - id: bns
    name: Bharatiya Nyaya Sanhita, 2023
    act_no: 45 of 2023
    enacted: 2023-12-25
    handle_url: https://www.indiacode.nic.in/handle/123456789/20062?locale=en
    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/20062/1/a202345.pdf
    notes: Repeals the Indian Penal Code, 1860. Prefer HTML/handle for Hindi to avoid Devanagari mojibake in PDF extraction.

  - id: bnss
    name: Bharatiya Nagarik Suraksha Sanhita, 2023
    act_no: 46 of 2023
    enacted: 2023-12-25
    handle_url: https://www.indiacode.nic.in/handle/123456789/20099?view_type=browse
    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/21544/1/the_bharatiya_nagarik_suraksha_sanhita,_2023.pdf
    notes: Chapters IX, XI, XII do not apply to Nagaland/tribal areas by default. Replaces CrPC.

  - id: bsa
    name: Bharatiya Sakshya Adhiniyam, 2023
    act_no: 47 of 2023
    enacted: 2023-12-25
    handle_url: https://www.indiacode.nic.in/handle/123456789/20063
    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/20063/1/aa202347.pdf
    notes: Replaces the Indian Evidence Act, 1872.

  - id: consumer_protection
    name: Consumer Protection Act, 2019
    act_no: 35 of 2019
    enacted: 2019-08-09
    handle_url: https://www.indiacode.nic.in/handle/123456789/15256?sam_handle=123456789%2F1362
    pdf_url: https://www.indiacode.nic.in/bitstream/123456789/15256/1/a2019-35.pdf
    notes: null

  - id: rti
    name: Right to Information Act, 2005
    act_no: 22 of 2005
    enacted: 2005-06-15
