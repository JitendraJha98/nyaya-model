# Nyaya-3B-v2 — same examples as v1, rewrapped in the inference-time RAG
# prompt (data/splits_rag, scripts/18): retrieved context + question -> the
# grounded answer. Motivation: v1's adapter went off-distribution under RAG
# prompts and stopped citing (reports/rag_eval_rescored.json).
#
# Method: full-precision bf16 LoRA — NO quantization (project decision 2026-07-13).

run_name: legal-3b-v2
model_id: Qwen/Qwen2.5-3B-Instruct
output_dir: outputs/legal-3b-v2

data:
  train_file: data/splits_rag/train.jsonl
  val_file: data/splits_rag/val.jsonl

method: lora

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  # RAG prompts tokenize to p99 3,842 / max 4,701 (reports/rag_dataset_report.json)
  max_seq_length: 6144
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  bf16: true
  optim: adamw_torch_fused
  # sequences are ~4x longer than v1 — smaller per-device batch, same
  # effective batch of 32
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  logging_steps: 10
  # 6,297 examples / effective batch 32 = ~197 steps total
  eval_steps: 50
  save_steps: 50
