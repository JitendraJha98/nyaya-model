# Smoke training run — 1,000 examples.
# Goal is NOT model quality. Goal: dataset loads, chat template correct, tokenization
# correct, loss decreases, no OOM, checkpoint saves, adapter reloads, inference works,
# eval pipeline works.
#
# Method: full-precision bf16 LoRA — NO quantization (project decision 2026-07-13;
# the A100-80GB pool fits a 3B bf16 base + LoRA comfortably).

run_name: nyaya-3b-smoke
model_id: Qwen/Qwen2.5-3B-Instruct
output_dir: outputs/smoke

data:
  train_file: data/splits/train.jsonl
  max_examples: 1000

method: lora

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_seq_length: 4096
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  bf16: true
  optim: adamw_torch_fused
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  logging_steps: 10
  save_steps: 250
