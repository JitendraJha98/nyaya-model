# Raw official assets fetched by scripts/13_download_raw_assets.py into
# data/raw/assets/<group>/<asset_id>.<filetype>  (+ manifest.json checksums).
#
# Every url below was verified live (HTTP 200, correct content) on 2026-07-14.
# Anything that could not be verified by script stays commented out under
# "UNVERIFIED — manual": the user downloads it by hand into the same layout,
# then re-runs the fetcher to record it in the manifest.
#
# Groups:
#   hindi_statutes    official Hindi PDFs of the priority acts (India Code
#                     handle pages carry a Hindi bitstream next to English).
#                     IT Act 2000 has no Hindi bitstream; the Constitution's
#                     diglot PDF already contains Hindi.
#   procedure_sources official citizen-facing pages grounding the procedure KB
#   law_commission_reports / aibe_papers — manual for now (JS-only portals)

