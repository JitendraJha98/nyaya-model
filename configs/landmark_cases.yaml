# Landmark Supreme Court cases registry — roadmap asset 4 scaffold.
#
# Consumed later by a landmark-extraction step that locates each case's full
# judgment text inside the local SC corpus (data/raw/judgments/sc_judgments,
# CC-BY-4.0) and emits training-ready rows. Grows toward ~200 entries.
#
# VERIFICATION STATUS: names/years/holdings are settled public knowledge;
# reporter citations still need a cross-check against the SC metadata parquet
# (downloading via scripts/12_bulk_judgments.py) before any citation is used
# in training data. Do not treat `citation` as ground truth until then.
#
# Schema (enforced by tests/test_landmark_registry.py):
#   case_id       kebab-case unique id
#   name          case title
#   citation      best-known reporter citation (pending cross-check, above)
#   year          decision year
#   court         SC
#   topics        list of tags (constitution, criminal, family, consumer, …)
#   why_landmark  one sentence

cases:
  - case_id: ak-gopalan-1950
    name: "A.K. Gopalan v. State of Madras"
    citation: "AIR 1950 SC 27"
    year: 1950
    court: SC
    topics: [constitution, personal-liberty, article-21]
    why_landmark: "First major Article 21 case; narrow 'procedure established by law' view later overruled by Maneka Gandhi."

  - case_id: shankari-prasad-1951
    name: "Shankari Prasad Singh Deo v. Union of India"
    citation: "AIR 1951 SC 458"
    year: 1951
    court: SC
    topics: [constitution, amendment-power]
    why_landmark: "Upheld Parliament's power to amend fundamental rights under Article 368; start of the amendment-power saga."

  - case_id: berubari-1960
    name: "In Re: The Berubari Union"
    citation: "AIR 1960 SC 845"
    year: 1960
    court: SC
    topics: [constitution, territory, preamble]
    why_landmark: "Held the Preamble is not a source of power; territory cession needs a constitutional amendment."

  - case_id: kedar-nath-1962
    name: "Kedar Nath Singh v. State of Bihar"
    citation: "AIR 1962 SC 955"
    year: 1962
    court: SC
    topics: [criminal, sedition, free-speech]
    why_landmark: "Read down sedition (s.124A IPC) to acts inciting violence or public disorder."

  - case_id: golaknath-1967
    name: "I.C. Golaknath v. State of Punjab"
    citation: "AIR 1967 SC 1643"
    year: 1967
    court: SC
    topics: [constitution, amendment-power, fundamental-rights]
    why_landmark: "Held Parliament could not amend away fundamental rights; prompted the 24th Amendment and Kesavananda."

  - case_id: rc-cooper-1970
    name: "R.C. Cooper v. Union of India (Bank Nationalisation)"
    citation: "AIR 1970 SC 564"
    year: 1970
    court: SC
    topics: [constitution, property, article-14]
    why_landmark: "Rejected the mutually-exclusive reading of fundamental rights; effects doctrine over object test."

  - case_id: kesavananda-bharati-1973
    name: "Kesavananda Bharati v. State of Kerala"
    citation: "AIR 1973 SC 1461"
    year: 1973
    court: SC
    topics: [constitution, basic-structure, amendment-power]
    why_landmark: "Created the basic structure doctrine limiting Parliament's power to amend the Constitution."

  - case_id: adm-jabalpur-1976
    name: "ADM Jabalpur v. Shivkant Shukla"
    citation: "AIR 1976 SC 1207"
    year: 1976
    court: SC
    topics: [constitution, emergency, habeas-corpus]
    why_landmark: "Emergency-era denial of habeas corpus; formally overruled in Puttaswamy — a cautionary landmark."

  - case_id: maneka-gandhi-1978
    name: "Maneka Gandhi v. Union of India"
    citation: "AIR 1978 SC 597"
    year: 1978
    court: SC
    topics: [constitution, article-21, due-process]
    why_landmark: "Read fair, just and reasonable procedure into Article 21; interlinked Articles 14, 19 and 21."

  - case_id: hussainara-khatoon-1979
    name: "Hussainara Khatoon v. State of Bihar"
    citation: "AIR 1979 SC 1369"
    year: 1979
    court: SC
    topics: [criminal, speedy-trial, legal-aid, article-21]
    why_landmark: "Recognized speedy trial and free legal aid as parts of Article 21; freed thousands of undertrials."

  - case_id: minerva-mills-1980
    name: "Minerva Mills Ltd. v. Union of India"
    citation: "AIR 1980 SC 1789"
    year: 1980
    court: SC
    topics: [constitution, basic-structure, judicial-review]
    why_landmark: "Struck down 42nd Amendment clauses; balance between rights and directive principles is basic structure."

  - case_id: bachan-singh-1980
    name: "Bachan Singh v. State of Punjab"
    citation: "AIR 1980 SC 898"
