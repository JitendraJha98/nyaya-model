# Hugging Face datasets to pull into data/hf/<safe-name>/
# Run: python scripts/00_download_hf_datasets.py
#
# Add any dataset by its HF id. `enabled: false` keeps it listed but skipped.
# NOTE: verify the exact HF id on huggingface.co before enabling ones marked "verify" —
# the planning docs name the dataset but not always the canonical hub id.
# NOTE: some datasets (aalap, IL-TUR) are gated on the Hub — run
# `huggingface-cli login` and accept each dataset's terms on huggingface.co first.

datasets:
  - id: opennyaiorg/aalap_instruction_dataset
    enabled: true
    purpose: "~22K instruction examples across 13 legal task types (filter citizen-relevant; license is per-slice, mostly CC0 but Contract Clause Generation is CC-BY-NC)"

  - id: Exploration-Lab/IL-TUR
    enabled: true
    purpose: "ACL 2024 Indian legal benchmark, 8 tasks, English + 9 Indian languages — evaluation only"

  - id: viber1/indian-law-dataset
    enabled: true
    purpose: "Supplementary Indian law instruction data"

  # --- ids verified against the HF API 2026-07-14 ---

  - id: bharatgenai/BhashaBench-Legal
    enabled: true
    purpose: "Exam-based legal MCQs, English + Hindi test parquets — evaluation only. CC-BY-4.0, gated:auto (needs huggingface-cli login)"

  - id: L-NLProc/NyayaAnumana-Classification-Data
    enabled: true
    allow_patterns: ["test/*", "dev/*"]
    purpose: "Largest Indian LJP corpus (~1M+ rows; Apache-2.0, gated:auto). Repo ships raw zips, not load_dataset format — snapshot the test/dev slices only; train zips are a v2 decision"

  - id: mohitskaushal/MILDSum_Dataset_Original_V2_with_eng_and_hindi_summary
    enabled: false   # third-party re-upload; official MILDSum is on GitHub (verify provenance/license before training on it)
    purpose: "Judgment summarization English->Hindi — summarization slice"

  - id: Exploration-Lab/ILDC
    enabled: false   # no canonical HF id exists (only third-party re-uploads); access requires a signed agreement — skipped per plan
    purpose: "ILDC judgment prediction + explanation corpus — v2 case-law reasoning"
