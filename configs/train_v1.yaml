# Nyaya-3B-v1 full training run — 8K–15K validated examples (not 25K automatically).
# Benchmark every meaningful checkpoint; the best model might be checkpoint-750, not the last.
#
# Method: full-precision bf16 LoRA — NO quantization (project decision 2026-07-13).

run_name: legal-3b-v1
model_id: Qwen/Qwen2.5-3B-Instruct
output_dir: outputs/legal-3b-v1

data:
  train_file: data/splits/train.jsonl
  val_file: data/splits/val.jsonl

method: lora

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_seq_length: 4096
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  bf16: true
  optim: adamw_torch_fused
  # effective batch size target: 32–64
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  logging_steps: 10
  # 6,297 examples / effective batch 32 = ~197 steps total, so checkpoint
  # cadence must be well under that to have checkpoints to benchmark at all
  eval_steps: 50
  save_steps: 50
  # flash_attention_2: enable if environment supports it
