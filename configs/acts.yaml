# Statute-DB act registry — the single source of truth consumed by
# scripts/03_build_corpus.py (which orchestrates src/nyaya/corpus.py).
#
# One entry per priority act (docs/ROADMAP.md "Core data assets" #1). The
# `act_id` scheme (e.g. bns_2023) is load-bearing: it names the output file
# data/canonical/<act_id>.jsonl AND is how src/nyaya/validators.py maps a row
# back to its act family. Do not rename act_ids casually.
#
# `enabled: false` means the extraction has not been verified yet. All 13
# priority acts verified + enabled 2026-07-14 (each ≥98% clean with a passing
# spot-check); only the Constitution remains disabled pending the article
# splitter (see splitter note on its entry).
#
# expected_sections drives the >=98%-clean extraction gate; null = report only.
# `url` is the direct India Code PDF; `handle_url` is the stable item page used
# as the download Referer (indiacode.nic.in 403s requests without one).
#
# KNOWN ISSUE: indiacode.nic.in 403s non-browser requests — scripts/03 sends a
# browser User-Agent + Referer + retries. India Code also periodically
# republishes PDFs at new bitstream IDs when an act is amended; if a `url`
# 404s, re-scrape the current PDF link from the act's handle_url page.

acts:
  - act_id: bns_2023
    act_name: "Bharatiya Nyaya Sanhita, 2023"
    enabled: true
    url: "https://www.indiacode.nic.in/bitstream/123456789/20062/1/a202345.pdf"
    handle_url: "https://www.indiacode.nic.in/handle/123456789/20062?locale=en"
    expected_sections: 358
    effective_date: "2024-07-01"
    notes: "Repeals the Indian Penal Code, 1860."

